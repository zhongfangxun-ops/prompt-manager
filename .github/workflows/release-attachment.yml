name: Attach a verified Windows package
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing draft release tag (vX.Y.Z)
        required: true
      blob:
        description: Git object ID of the verified release ZIP in this repository
        required: true
      sha256:
        description: SHA-256 of the locally tested ZIP
        required: true
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Verify bytes and attach to the draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.version }}
          BLOB: ${{ inputs.blob }}
          DIGEST: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$BLOB" =~ ^[0-9a-f]{40}$ && "$DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" == true ]]
          package="PromptManager-${TAG#v}-windows-x64.zip"
          gh api "repos/$GH_REPO/git/blobs/$BLOB" --jq .content | base64 -d > "$package"
          echo "$DIGEST  $package" | sha256sum --check
          gh release upload "$TAG" "$package" --clobber

