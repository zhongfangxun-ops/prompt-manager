name: Windows build and tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-sqlite3
      - name: Build and run native tests
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure
          cmake --install build --prefix dist/PromptManager
      - name: Exercise the release executable
        shell: pwsh
        run: |
          $env:PROMPT_TEST_NOTEPAD='1'
          python -m pip install pywin32
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/desktop_probe.py dist/PromptManager/PromptManager.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/shell_flow.py dist/PromptManager/PromptManager.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/import_appearance.py dist/PromptManager/PromptManager.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($case in @('flow','save','ime','copy')) {
            python tests/ui_regression.py dist/PromptManager/PromptManager.exe $case
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

      - name: Probe foreground fullscreen on the test desktop
        shell: pwsh
        continue-on-error: true
        run: python tests/fullscreen_probe.py dist/PromptManager/PromptManager.exe
